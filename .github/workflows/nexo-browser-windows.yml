name: Nexo Browser - Windows Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build Nexo Browser for Windows
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          $url = "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe"
          $installer = "$env:RUNNER_TEMP\MozillaBuildSetup.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait

          if (-not (Test-Path "C:\mozilla-build")) {
            Write-Error "MozillaBuild installation failed."
            exit 1
          }

      - name: Bootstrap Firefox build environment
        shell: pwsh
        run: |
          ./mach bootstrap --application-choice browser

      - name: Build Nexo Browser
        shell: pwsh
        run: |
          ./mach build

      - name: Package Nexo Browser
        shell: pwsh
        run: |
          ./mach package

      - name: Upload Nexo Browser build
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-Browser-Windows
          path: |
            obj-*/dist/*.exe
            obj-*/dist/*.zip
          if-no-files-found: error
